<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="gl"></canvas>
<script type="module">
import { buildTrack, TRACKS } from '../js/track-data.js';
import { World } from '../js/gfx/world.js';
import { makeCar } from '../js/car-physics.js';
import { CARS } from '../js/config.js';
const q = new URLSearchParams(location.search);
const track = buildTrack(TRACKS.downtown);
const world = new World(document.getElementById('gl'), track, { quality: q.get('q') || 'high' });
window.__world = world;
const errs = []; window.addEventListener('error', e => errs.push(String(e.message))); window.__errs = errs;
try {
  await world.init();
  const spot = world.showcaseSpot(26, 0);
  world.setCars([{ id: 0, color: q.get('color') || '#1f4fd8' }]);
  const car = makeCar(CARS[0].physics, spot.x, spot.z, spot.heading);
  const rc = { id: 0, isPlayer: true, car, info: { d: 0, nx: 0, nz: 0 } };
  const mode = q.get('mode') || 'menu';
  const orbit = { target: { x: spot.x, y: 0.7, z: spot.z }, radius: +(q.get('r') || 8.5), height: +(q.get('h') || 2.3), speed: 0, angle: +(q.get('a') || 0.6), fov: +(q.get('fov') || 45) };
  window.__ready = false;
  let n = 0;
  function loop() {
    world.frame(1/60, { mode: 'menu', orbit, cars: [rc], playerId: 0, car: null });
    if (++n === 8) window.__ready = true;
    requestAnimationFrame(loop);
  }
  loop();
} catch (e) { errs.push(String(e && e.stack || e)); window.__ready = 'error'; }
</script></body></html>
